# Hook-check registry read by `aaxis-oro version applies --check <id>`; a missing `oro` means ">=6.1.0".
checks:
  # Deny edits that add `decorates:` on a service others typehint (pretooluse_edit.py)
  - id: decorates-unsafe-target
    severity: deny
    oro: ">=6.1.0"
    topic: decorates-unsafe-target
  # Deny extension-file edits only when the atlas index is unusable: missing/corrupt, format/schema mismatch, composer.lock or vendor changed. A merely behind (src/config) index is allowed with a warning and a background incremental rebuild (pretooluse_edit.py)
  - id: atlas-index-fresh
    severity: deny
    oro: ">=6.1.0"
  # Deny extension-file edits before any `atlas <sub>` query ran this session (pretooluse_edit.py)
  - id: atlas-query-first
    severity: deny
    oro: ">=6.1.0"
  # `aaxis-oro review check`: cited atlas entries in a plan must exist
  - id: review-atlas-citations
    severity: deny
    oro: ">=6.1.0"
  # No AppBundle/ path in the diff or commit (git-ignored spike bundle)
  - id: review-no-appbundle
    severity: deny
    oro: ">=6.1.0"
  # No project-namespace `use` under src/Aaxis/ (Aaxis bundles are project-independent)
  - id: review-no-project-namespace
    severity: deny
    oro: ">=6.1.0"
  # Direct disk I/O in touched src is a warning only
  - id: review-direct-io
    severity: warn
    oro: ">=6.1.0"
  # Added test skips/disables and removed assertions in test files (warning only)
  - id: review-test-weakening
    severity: warn
    oro: ">=6.1.0"
  # Setup project, ticket branch: staged extension-point change (unless SMALL: <=3 files, no risk path) needs .oro-ai/task/<KEY>/architect-gate.md approved/skipped
  - id: review-ticket-gate
    severity: deny
    oro: ">=6.1.0"
  # Setup project, ticket branch: STATUS.md and e2e feature/steps on the branch (warning only)
  - id: review-ticket-evidence
    severity: warn
    oro: ">=6.1.0"
  # Setup project, ticket branch with committed code: `git push` needs .oro-ai/task/<KEY>/review.md approved/skipped covering HEAD
  - id: review-ticket-push
    severity: deny
    oro: ">=6.1.0"
  # Same condition at Stop once the tree has no uncommitted code: remind the main session (warn, never blocks; the push gate stays deny) (stop.py)
  - id: review-ticket-stop
    severity: warn
    oro: ">=7.0.0"
