name: lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 bin/oro-skills-lint
      - run: python3 -m unittest discover -s tests/oroversion
      - run: python3 -m unittest discover -s oro-atlas/tests
      - run: python3 -m unittest discover -s tests/local_env
