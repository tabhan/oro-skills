# Managed by aaxis-oro env. Test stack server block: same shared php-fpm pool, kernel env chosen by fastcgi_param.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name e2e.example.test;
    ssl_certificate_key /etc/ssl/example.key;
    ssl_certificate /etc/ssl/example.crt;
    ssl_protocols TLSv1.3;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM:AES2;
    root /oroapp/public;
    index index.php;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    client_max_body_size 64m;
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    try_files $uri $uri/ @rewrite;
    location @rewrite {
        rewrite ^/(.*)$ /index.php/$1;
    }
    location ~ /\.ht {
        deny all;
    }
    location ~* ^[^(\.php)]+\.(jpg|jpeg|gif|png|ico|css|txt|bmp|js|woff2|svg|webp)$ {
        add_header Cache-Control public;
        expires 1h;
        access_log off;
    }
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        if (!-f $document_root$fastcgi_script_name) {
            return 404;
        }
        include                         fastcgi_params;
        fastcgi_pass                    php-fpm;
        fastcgi_index                   index.php;
        fastcgi_intercept_errors        on;
        fastcgi_connect_timeout         300;
        fastcgi_send_timeout            300;
        fastcgi_read_timeout            300;
        fastcgi_buffer_size             128k;
        fastcgi_buffers                 4   256k;
        fastcgi_busy_buffers_size       256k;
        fastcgi_temp_file_write_size    256k;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO        $fastcgi_path_info;
        fastcgi_param  HTTPS            on;
        fastcgi_param  ORO_ENV          behat_test;
        fastcgi_param  ORO_DEBUG        0;
    }
    # No websocket server runs for the test stack by default; the location keeps /ws from falling through to index.php.
    location /ws {
        reset_timedout_connection on;
        proxy_buffers 8 32k;
        proxy_buffer_size 64k;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-NginX-Proxy true;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8081/;
        proxy_redirect off;
        proxy_read_timeout 86400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        error_log /var/log/nginx/oro_test_wss_error.log;
        access_log /var/log/nginx/oro_test_wss_access.log;
    }
    error_log /var/log/nginx/oro_test_https_error.log;
    access_log /var/log/nginx/oro_test_https_access.log;
}
