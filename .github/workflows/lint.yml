name: lint
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 bin/aaxis-oro dev lint
      - run: python3 -m unittest discover -s tests/oroversion
      - run: python3 -m unittest discover -s atlas/tests
      - run: python3 -m unittest discover -s tests/local_env
      - run: python3 -m unittest discover -s tests/aaxis
      - run: python3 -m unittest discover -s tests/install
      - run: python3 -m unittest discover -s tests/projsetup
      - run: python3 -m unittest discover -s tests/spectrace
